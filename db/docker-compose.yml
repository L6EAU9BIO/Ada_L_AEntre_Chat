services:
  db:
    image: postgres:18
    container_name: aentre-chat-db
    env_file:
      - ../back/.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - aentre_chats_data:/var/lib/postgresql
      - ./migration_up.sql:/docker-entrypoint-initdb.d/01_migration_up.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  aentre_chats_data: